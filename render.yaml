services:
  - type: web
    name: thismoment-music
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/
    autoDeployTrigger: commit
    envVars:
      - key: MUSIC_LIBRARY_ROOT
        value: /tmp/MusicLibrary
      - key: FRONTEND_BUILD_DIR
        value: /app/frontend/build
      - key: CORS_ORIGINS
        value: "*"
